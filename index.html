*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Mulish',system-ui,sans-serif;background:var(--nav);color:#fff}
a{color:inherit;text-decoration:none}

/* NAVBAR */
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--nav);position:relative;z-index:5}
.left,.right{display:flex;align-items:center;gap:6px}
.logo{display:flex;align-items:center;gap:10px;margin-right:22px;font:800 26px 'Baloo 2',sans-serif;letter-spacing:.5px}
.coin{width:22px;height:26px;border-radius:50%;background:var(--yellow);box-shadow:inset -3px 0 0 var(--yellow-d);display:grid;place-items:center;color:var(--yellow-d);font:800 13px 'Baloo 2'}
nav{display:flex;gap:4px}
nav a{display:flex;align-items:center;gap:6px;padding:8px 12px;font-weight:700;font-size:15px;color:#e9ecf8;border-radius:8px}
nav a:hover{background:#ffffff14}
svg.chev{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;opacity:.8}
.icon{background:none;border:0;color:#cfd4ea;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;cursor:pointer}
.icon:hover{background:#ffffff14}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn{display:inline-block;background:var(--yellow);color:#1b1500;font-weight:800;border:2px solid var(--yellow-d);border-radius:4px;box-shadow:0 4px 0 var(--yellow-d);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-d)}
.btn.sm{padding:7px 14px;font-size:15px;margin-left:8px}
.btn.lg{padding:12px 34px;font-size:19px}

.stage *{position:absolute;pointer-events:none}
.scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#050a24ee 0%,#050a24b0 26%,#050a2450 44%,#050a2400 60%)}
.hero>:not(.stage):not(.scrim){position:relative;z-index:2}
.kicker{font-weight:800;font-size:clamp(13px,1.5vw,18px);letter-spacing:.22em;color:#bcd6ff;text-transform:uppercase}
.title{font:700 clamp(44px,7.2vw,86px)/.9 'Pixelify Sans',monospace;margin:12px 0 16px}
.title span{display:block;position:relative;white-space:nowrap;color:transparent;background:linear-gradient(180deg,#ffe27a 10%,#ffb36b 55%,#ff8f9f 100%);-webkit-background-clip:text;background-clip:text}
.title span::before{content:attr(data-t);position:absolute;inset:0;z-index:-1;color:#4a2338;-webkit-text-stroke:.14em #4a2338;text-shadow:0 .07em 0 #4a2338}
.sub{font-weight:700;font-size:clamp(14px,1.4vw,18px);text-shadow:0 2px 0 #0008;margin-bottom:22px;max-width:92vw}
.chat{position:fixed;right:20px;bottom:20px;z-index:6;width:48px;height:48px;border-radius:50%;background:var(--yellow);border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 8px #0005}
.chat i{width:18px;height:16px;background:#1b1500;border-radius:3px 3px 3px 0}

/* CAPAS ANIMADAS */
.glow{background:radial-gradient(closest-side,#50ff8cb0,#50ff8c00);mix-blend-mode:screen;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.94)}50%{opacity:.95;transform:scale(1.06)}}
.mascot{transform-origin:50% 100%;animation:hop 5s infinite}
@keyframes hop{0%,22%{transform:none}26%{transform:scale(1.07,1)}34%{transform:translateY(-14%) rotate(-3deg) scale(.96,1.07)}42%{transform:scale(1.07,1)}50%{transform:translateY(-14%) rotate(3deg) scale(.96,1.07)}58%{transform:scale(1.07,1)}68%{transform:translateY(-26%) rotate(-5deg) scale(.95,1.09)}80%{transform:scale(1.09,1)}86%{transform:translateY(-3%) scale(.99,1.02)}92%,100%{transform:none}}
.spr{background:var(--spr) center/100% 100% no-repeat;animation:neon 3.2s ease-in-out infinite}
@keyframes neon{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) saturate(1.15)}}
.shine{-webkit-mask:var(--spr) center/100% 100% no-repeat;mask:var(--spr) center/100% 100% no-repeat;background:linear-gradient(105deg,#fff0 42%,#fffc 50%,#fff0 58%) 100% 0/260% 100% no-repeat;mix-blend-mode:screen;animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,35%{background-position:100% 0}70%,100%{background-position:0 0}}
.wink{background:linear-gradient(#092937 0 36%,#a7ffd2 36% 64%,#092937 64%);animation:wink 5s infinite}
@keyframes wink{0%,6%{opacity:0}8%,18%{opacity:1}20%,100%{opacity:0}}
.px{background:#5dff8a;box-shadow:0 0 6px #5dff8a;animation:rise 4s linear infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-800%)}}
.win{overflow:hidden}
.cloud{background:#fff;opacity:.9;clip-path:polygon(0 62%,12% 62%,12% 42%,28% 42%,28% 22%,52% 22%,52% 0,76% 0,76% 22%,90% 22%,90% 62%,100% 62%,100% 100%,0 100%);animation:drift 50s linear infinite}
@keyframes drift{from{left:-40%}to{left:110%}}
.puff{background:#fff;opacity:0;animation:steam 3.4s steps(9) infinite}
@keyframes steam{0%{opacity:0;transform:translate(0,0)}20%{opacity:.7}100%{opacity:0;transform:translate(60%,-900%)}}
.screen{background:#a6ecff;mix-blend-mode:screen;animation:flick 1.6s steps(1) infinite}
@keyframes flick{0%{opacity:.05}20%{opacity:.28}35%{opacity:.1}60%{opacity:.34}80%{opacity:.14}}
.lamp{background:radial-gradient(closest-side,#ffc86ec0,#ffc86e00);mix-blend-mode:screen;animation:lamp 4.5s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.5}45%{opacity:.85}50%{opacity:.6}70%{opacity:.9}}
.spark{background:linear-gradient(#fff,#fff) center/100% 24% no-repeat,linear-gradient(#fff,#fff) center/24% 100% no-repeat;opacity:0;animation:tw 2.6s steps(5) infinite}
@keyframes tw{0%,60%,100%{opacity:0;transform:scale(.4)}78%{opacity:1;transform:scale(1)}}
.hap{background:#092937;opacity:0;animation:hap 5s infinite}
.hap::after{content:'';position:absolute;left:12%;right:12%;top:28%;height:38%;border:max(2px,.26vw) solid #a7ffd2;border-bottom:0;border-radius:50% 50% 0 0}
@keyframes hap{0%,28%{opacity:0}30%,76%{opacity:1}78%,100%{opacity:0}}
.sh{background:radial-gradient(closest-side,#06131aaa,#06131a00);animation:shad 5s infinite}
@keyframes shad{0%,22%,42%,58%,80%,100%{transform:none;opacity:.7}34%,50%{transform:scale(.8);opacity:.45}68%{transform:scale(.6);opacity:.3}}
.game{border-radius:5%/7%;overflow:hidden;background:#0a0f2e}
.game canvas{inset:0;width:100%;height:100%;image-rendering:pixelated}
.game::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0004 0 1px,#0000 1px 3px)}
.joy{background:#e0453a;animation:joy .45s steps(2) infinite}
@keyframes joy{0%{transform:translate(-70%,0)}50%{transform:translate(60%,25%)}}
.bt{animation:bt .6s steps(1) infinite}
@keyframes bt{0%{opacity:1}50%{opacity:.1}}
.mini{background:linear-gradient(#101433 0 38%,#8fffc0 38% 64%,#101433 64%);animation:mini 3.6s steps(1) infinite}
@keyframes mini{0%,88%{opacity:0}90%,96%{opacity:1}98%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.stage *{animation:none!important}.wink,.hap,.mini,.px,.puff,.spark{display:none}}
@media(max-width:860px){nav,.icon.hide-m{display:none}.logo{margin-right:0}}
</style>
</head>
<body>
<header>
  <div class="left">
    <a class="logo" href="#"><span class="coin">0</span>Codédex</a>
    <nav>
      <a href="#">Aprender <svg class="chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></a>
      <a href="#">Práctica <svg class="chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></a>
    </nav>
  </div>
  <div class="right">
    <button class="icon hide-m" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="icon hide-m" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg></button>
  </div>
</header>

<main class="hero">
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="scrim"></div>
  <p class="kicker">Comience su</p>
  <h1 class="title" aria-label="Coding Adventure"><span data-t="Coding">Coding</span><span data-t="Adventure">Adventure</span></h1>
  <p class="sub">La forma más divertida y accesible para principiantes de aprender a programar. ⋆˚✧</p>
  <a class="btn lg" href="#">Comience</a>
</main>


<script>
// Todas las coordenadas están en píxeles de la imagen original (1376x768) y se convierten a %
const IW=1376,IH=768,stage=document.getElementById('stage');
const pc=(v,t)=>(v/t*100)+'%';
function box(cls,x,y,w,h,parent=stage,extra=''){
  const e=document.createElement('div');e.className=cls;
  const [W,H]=parent===stage?[IW,IH]:[parent._w,parent._h];
  e.style.cssText=`left:${pc(x,W)};top:${pc(y,H)};width:${pc(w,W)};height:${pc(h,H)};${extra}`;
  parent.appendChild(e);return e;
}
let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;

box('glow',470,320,420,360);                       // brillo detrás de la mascota
box('sh',560,622,280,28);                          // sombra que se achica al saltar
const m=box('mascot',520,360,360,290);m._w=360;m._h=290; // mascota (cara + 67) como sprite aparte
box('spr',0,0,360,290,m);box('shine',0,0,360,290,m);box('wink',172,157,16,24,m);box('hap',172,157,16,24,m);box('hap',123,163,16,24,m); // guiño del ojo derecho
for(let i=0;i<14;i++){                              // partículas verdes
  const sz=6+Math.round(rnd()*4);
  box('px',540+rnd()*310,430+rnd()*190,sz,sz,stage,`--dx:${Math.round((rnd()-.5)*300)}%;animation-duration:${3+rnd()*3}s;animation-delay:-${rnd()*6}s`);
}
[[292,140,190,70],[520,168,320,56],[985,150,215,60]].forEach(([x,y,w,h],i)=>{ // nubes en ventanas
  const win=box('win',x,y,w,h);win._w=w;win._h=h;
  box('cloud',0,10,30,48,win,`animation-duration:${42+i*9}s;animation-delay:-${i*14}s`);
  box('cloud',0,38,20,36,win,`animation-duration:${60+i*7}s;animation-delay:-${22+i*9}s`);
});
[[709,343],[455,318]].forEach(([x,y],k)=>{for(let i=0;i<3;i++)box('puff',x,y,6,6,stage,`animation-delay:-${i*1.1+k*.5}s`)}); // vapor
box('joy',826,330,6,6);box('bt',810,339,5,3,stage,'background:#7dffa0');box('bt',850,342,5,3,stage,'background:#fff;animation-delay:-.3s');   // palanca y botones del arcade
box('screen',1278,224,92,22,stage,'background:#ffd89a;animation-duration:2.4s');box('mini',1312,297,5,7);box('mini',1323,297,5,7);box('glow',1262,250,110,90,stage,'animation-delay:-1s'); // cartel GAME
(function(){ // minijuego en la pantalla del arcade
 const host=box('game',810,271,67,55),c=document.createElement('canvas');c.width=56;c.height=46;host.appendChild(c);
 const x=c.getContext('2d'),GW=56,GH=46,COL=['#ff4fd8','#ffd43b','#4dff88'],SP=[10,31,21,27];
 const stars=Array.from({length:14},()=>[Math.random()*GW|0,Math.random()*GH|0]);
 let al,ox,oy,dir,ship=28,bul,boom=[],tick=0,wait=0;
 const reset=()=>{al=[];for(let r=0;r<3;r++)for(let q=0;q<5;q++)al.push({r,q,on:true});ox=3;oy=5;dir=1;bul=null;wait=0};
 reset();
 function step(){
  tick++;
  if(wait){if(--wait===0)reset();return}
  if(tick%3===0){ox+=dir;if(ox>GW-2-37||ox<2){dir=-dir;oy++;ox+=dir}if(oy>16)reset()}
  const live=al.filter(a=>a.on);
  if(!live.length){wait=8;return}
  const cx=a=>ox+a.q*8+2,tg=live.reduce((a,b)=>Math.abs(cx(b)-ship)<Math.abs(cx(a)-ship)?b:a),tx=cx(tg);
  ship+=Math.sign(tx-ship)*Math.min(2,Math.abs(tx-ship));
  if(!bul&&Math.abs(tx-ship)<2)bul={x:Math.round(ship),y:GH-7};
  if(bul){
   bul.y-=4;
   const hit=live.filter(a=>{const ax=ox+a.q*8,ay=oy+a.r*7;return bul.x>=ax&&bul.x<ax+5&&bul.y>=ay&&bul.y<ay+4}).sort((a,b)=>b.r-a.r)[0];
   if(hit){hit.on=false;boom.push({x:cx(hit),y:oy+hit.r*7+2,t:4});bul=null}else if(bul.y<0)bul=null;
  }
 }
 function draw(){
  x.fillStyle='#0a0f2e';x.fillRect(0,0,GW,GH);
  x.fillStyle='#6b78c9';stars.forEach(([a,b])=>x.fillRect(a,(b+(tick>>2))%GH,1,1));
  al.forEach(a=>{if(!a.on)return;x.fillStyle=COL[a.r];SP.forEach((row,j)=>{for(let i=0;i<5;i++)if(row>>(4-i)&1)x.fillRect(ox+a.q*8+i,oy+a.r*7+j,1,1)})});
  x.fillStyle='#fff';[[2,0],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2],[4,2]].forEach(([i,j])=>x.fillRect(Math.round(ship)-2+i,GH-5+j,1,1));
  if(bul){x.fillStyle='#ffe66b';x.fillRect(bul.x,bul.y,1,3)}
  boom=boom.filter(e=>e.t-->0);boom.forEach(e=>{x.fillStyle=e.t%2?'#fff':'#ff9a3c';x.fillRect(e.x-2,e.y-1,5,1);x.fillRect(e.x-1,e.y-2,3,3)});
 }
 draw();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{step();draw()},110);
})();
[[372,100],[497,152],[880,152],[1052,98]].forEach(([x,y],i)=>box('lamp',x-90,y-60,180,150,stage,`animation-delay:-${i*1.3}s`)); // lámparas
[[905,425],[928,458],[872,482],[952,470],[890,448]].forEach(([x,y],i)=>box('spark',x,y,14,14,stage,`animation-delay:-${i*.55}s`)); // monedas
</script>
