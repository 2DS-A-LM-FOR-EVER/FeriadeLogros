<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codédex – Coding Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/juegos.css">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Mulish:wght@600;700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#050a24">
<script>try{if(localStorage.getItem("tema")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>
/* Parche: style.css usa --ph pero define --hh. Aquí lo igualo para que el hero no se aplaste */
:root{--ph:var(--hh, max(460px, calc(100vh - 60px)))}

/* ═══════════════════════════════════════════════════════════
   FONDO GIF — ESPACIO PARA TU GIF
   El div .fondo-gif ya está puesto en el <body> (primera línea).
   Para activarlo:
   1) Copia tu GIF a la RAÍZ (junto a index.html) con nombre: fondo.gif
      (si quieres otro nombre, cambia la url aquí abajo)
   2) En la regla .fondo-gif, cambia  background:none  por:
      background:url("fondo.gif") center/cover no-repeat;
   3) Guarda y recarga con Ctrl+Shift+R
   Nota: queda DETRÁS de todo (z-index 0). Si quieres que tape también
   el dibujo pixel-art del hero, agrega además:  .stage{display:none}
   ═══════════════════════════════════════════════════════════ */
.fondo-gif{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  z-index:0;
  pointer-events:none;
  background:url("Fondo.gif") center center / cover no-repeat #050a24;
  image-rendering:pixelated;
}
.stage{display:none}

@media (max-width:768px) and (orientation:portrait){
  .fondo-gif{
    background-size:contain;
    background-position:center center;
    background-color:#050a24;
  }
}
/* RANKING TOP 10 */
.rk-link{display:inline-block;margin-top:18px;font:700 14px 'Pixelify Sans',monospace;letter-spacing:.1em;color:#bcd6ff;animation:rkb 1.2s steps(2) infinite}
@keyframes rkb{50%{opacity:.35}}
.rk-sec{max-width:760px;margin:0 auto;padding:70px 20px 90px;color:#fff;font-family:'Mulish',sans-serif;position:relative;z-index:1}
.rk-t{font:700 clamp(30px,6vw,52px) 'Pixelify Sans',monospace;text-align:center;text-shadow:0 4px 0 #000}
.rk-t span{color:#fdc815;text-shadow:0 4px 0 #c9940a,0 8px 0 #000}
.rk-s{text-align:center;color:#8f9bc4;font-weight:700;margin:6px 0 28px}
.rk-list{list-style:none;display:grid;gap:12px}
.rk-row{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;background:#0d1330;border:4px solid #222d5e;box-shadow:5px 5px 0 #000;animation:rkin .4s steps(4) both}
@keyframes rkin{from{opacity:0;transform:translateX(-14px)}}
.rk-row.me{border-color:#fdc815;background:#131b42}
.rk-pos{width:42px;text-align:center;font:700 26px 'Pixelify Sans',monospace;color:#8f9bc4}
.rk-row:nth-child(1) .rk-pos{color:#ffc24b;text-shadow:0 0 12px #ffc24b}
.rk-row:nth-child(2) .rk-pos{color:#d0d8e8}
.rk-row:nth-child(3) .rk-pos{color:#cd7f32}
.rk-av{width:48px;height:48px;background:#000;border:3px solid #222d5e;object-fit:contain;image-rendering:pixelated;flex:none}
.rk-name{flex:1;min-width:0;font:700 20px 'Pixelify Sans',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-chip{font:700 12px 'Pixelify Sans',monospace;padding:4px 8px;border:2px solid #000;color:#120a05}
.rk-xp{font:700 20px 'Pixelify Sans',monospace;color:#fdc815;min-width:84px;text-align:right}
.rk-msg{text-align:center;color:#8f9bc4;font-weight:800;padding:26px}
@media(max-width:520px){.rk-chip{display:none}}

/* CURSOR ESPADA (bloque estándar, idéntico al que SÍ funciona en ranking.html y juegos.html) */
html,body,body *{cursor:none!important}
#espada-cursor{position:fixed;inset:auto;top:0;left:0;margin:0;padding:0;border:0;background:none;overflow:visible;width:30px;height:30px;pointer-events:none;z-index:999999;mix-blend-mode:difference;will-change:transform;opacity:0}
#espada-cursor.on{opacity:1}
#espada-cursor img{width:100%;height:100%;display:block;filter:invert(1);pointer-events:none;user-select:none;image-rendering:pixelated}
@media (hover:none){html,body,body *{cursor:auto!important}#espada-cursor{display:none}}
</style>
</head>
<body>

<!-- FONDO GIF: div reservado. Las instrucciones están en el <style> de arriba, busca "FONDO GIF" -->
<div class="fondo-gif" aria-hidden="true"></div>

<header>
  <div class="left">
    <a class="logo" href="#"><span class="coin">0</span><span class="logo-t">CODING</span></a>
  </div>
  <div class="right">
    <button class="icon burger" id="burger" aria-label="Abrir menú" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>

<!-- Menú lateral para celular (script.js necesita #burger, #drawer y #drawerBg) -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-top">
    <button class="icon" id="drawerClose" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <span>Menú</span>
  </div>
  <ul>
    <li><a href="registro.html">Iniciar Sesión</a></li>
      <li><a href="ranking.html">Salón de la Fama</a></li>
  </ul>
</aside>

<main class="hero">
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="scrim"></div>
  <p class="kicker">Comience su</p>
  <h1 class="title"><img src="LandingPage_Text.gif" alt="Coding Adventure"></h1>
  <p class="sub">La forma más divertida y accesible para principiantes de aprender a programar. ⋆˚</p>
  <a class="btn lg" href="registro.html">Comience</a>
  <a class="rk-link" href="#ranking">Ver ranking ▼</a>
</main>

<section class="rk-sec" id="ranking">
  <h2 class="rk-t">TOP 10 <span>JUGADORES</span></h2>
  <p class="rk-s">Los que más XP han ganado</p>
  <ol class="rk-list" id="rkList"><li class="rk-msg">Cargando ranking…</li></ol>
</section>

<!-- ESPADA (misma ruta que en las páginas donde sí funciona: raíz) -->
<div id="espada-cursor" popover="manual"><img src="ARMA.png" alt=""></div>

<!-- FIREBASE (compat) + init. NUNCA cargues juegos.js ni registro.js aquí: te expulsan a login -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="java/firebase-init.js"></script>
<script src="java/script.js"></script>

<script>
/* ═════════════ RANKING TOP 10 EN VIVO (inline, con guards) ═════════════ */
(function(){
  const lista = document.getElementById('rkList');
  if (!lista) return;
  const msg = t => { lista.replaceChildren(Object.assign(document.createElement('li'), {className:'rk-msg', textContent:t})); };

  if (typeof db === 'undefined' || !db) { msg('No se pudo conectar con Firebase. Revisa tu conexión.'); return; }

  const RANGOS = [
    { n:'BRONCE',   min:0,    c:'#cd7f32' },
    { n:'ORO',      min:300,  c:'#ffc24b' },
    { n:'PLATINO',  min:700,  c:'#8fe8d8' },
    { n:'DIAMANTE', min:1200, c:'#4fd8ff' }
  ];
  const rangoDe = xp => RANGOS.reduce((a,r) => xp >= r.min ? r : a, RANGOS[0]);
  const yo = (localStorage.getItem('usuarioActual') || '').toLowerCase();

  function fila(d, i){
    const r = rangoDe(d.xp || 0);
    const li = document.createElement('li');
    li.className = 'rk-row' + ((d.usuario||'').toLowerCase() === yo ? ' me' : '');
    li.style.animationDelay = (i * 60) + 'ms';
    const pos = document.createElement('div'); pos.className='rk-pos'; pos.textContent = i + 1;
    const av  = document.createElement('img'); av.className='rk-av'; av.alt='';
    av.src = d.avatar || 'boy.gif';
    av.onerror = () => { av.onerror = null; av.src = 'boy.gif'; };
    const nm  = document.createElement('div'); nm.className='rk-name'; nm.textContent = d.usuario || '???';
    const ch  = document.createElement('span'); ch.className='rk-chip'; ch.textContent = r.n; ch.style.background = r.c;
    const xp  = document.createElement('div'); xp.className='rk-xp'; xp.textContent = (d.xp||0) + ' XP';
    li.append(pos, av, nm, ch, xp);
    return li;
  }

  db.collection('ranking').orderBy('xp','desc').limit(10).onSnapshot(
    snap => {
      if (snap.empty) return msg('Aún no hay jugadores. ¡Sé el primero!');
      lista.replaceChildren(...snap.docs.map((doc, i) => fila(doc.data(), i)));
    },
    err => {
      console.error(err);
      msg('No se pudo leer el ranking. Revisa las reglas de Firestore.');
    }
  );
})();

/* ═════════════ CURSOR ESPADA (bloque estándar) ═════════════ */
(function(){
  const s = document.getElementById('espada-cursor');
  if (!s) { console.warn('⚠️ No se encontró #espada-cursor'); return; }
  const raise = () => { try{s.hidePopover()}catch(e){} try{s.showPopover()}catch(e){} };
  window.raiseSword = raise; raise();
  document.addEventListener('mousemove', e => {
    s.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    s.classList.add('on');
  });
  document.documentElement.addEventListener('mouseleave', () => s.classList.remove('on'));
})();
</script>
</body>
</html>
