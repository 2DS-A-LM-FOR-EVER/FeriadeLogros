<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXELWORD – Coding Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/juegos.css">
<link rel="icon" href="ho.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Mulish:wght@600;700;800&family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#050a24">
<script>try{if(localStorage.getItem("tema")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>
  /* ═══════════ TIPOGRAFÍA PIXEL-ART GLOBAL ═══════════ */
  html, body,
  body *:not(svg):not(svg *){
    font-family:'Pixelify Sans', monospace !important;
  }
  h1,h2,h3,h4,p,a,li,span,div,button,input,label{
    font-family:'Pixelify Sans', monospace !important;
    letter-spacing: .5px;
  }

  /* ═══════════ TÍTULO PIXELWORD ═══════════ */
  .hero .title{text-align:center;margin:0 auto;width:100%}
  .hero .title img{
    width:min(760px, 88vw) !important;
    max-width:100% !important;
    height:auto !important;
    display:block;
    margin:0 auto;
    image-rendering:pixelated;
  }
  @media (max-width:768px){
    .hero .title img{width:min(560px, 92vw) !important}
  }

  /* ═══════════ LOGO: ESTRELLA + PIXELWORD ═══════════ */
  .logo{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .logo img.coin,
  .logo .coin{
    width:42px !important;
    height:42px !important;
    object-fit:contain;
    image-rendering:pixelated;
    background:none !important;
    border:0 !important;
    border-radius:0 !important;
    padding:0 !important;
    box-shadow:none !important;
    display:block;
  }
  .logo .logo-t{
    font-family:'Pixelify Sans', monospace !important;
    font-size:clamp(18px, 2.6vw, 24px) !important;
    font-weight:700 !important;
    letter-spacing:1.5px !important;
    color:#ffffff;
    text-transform:uppercase;
    line-height:1;
  }

  /* ═══════════ HERO: agrandar textos ═══════════ */
  .hero .kicker{
    font-size:clamp(16px, 2vw, 22px) !important;
    letter-spacing:2px !important;
  }
  .hero .sub{
    font-size:clamp(16px, 1.8vw, 21px) !important;
    line-height:1.5 !important;
    max-width:640px;
    margin-left:auto;
    margin-right:auto;
  }
  .hero .btn.lg{
    font-size:clamp(18px, 2vw, 22px) !important;
    padding:16px 42px !important;
  }
  .hero .rk-link{
    font-size:clamp(15px, 1.6vw, 18px) !important;
    letter-spacing:2px !important;
  }

  /* ═══════════ RANKING: tipografía más grande ═══════════ */
  .rk-t{font-size:clamp(34px, 6vw, 56px) !important;letter-spacing:2px !important}
  .rk-s{font-size:clamp(16px, 1.8vw, 20px) !important;letter-spacing:1px !important}
  .rk-row{font-size:clamp(16px, 1.6vw, 20px) !important}
  .rk-pos{font-size:clamp(22px, 2.4vw, 30px) !important}
  .rk-name{font-size:clamp(18px, 2vw, 24px) !important;letter-spacing:1px !important}
  .rk-xp{font-size:clamp(18px, 2vw, 22px) !important;letter-spacing:1px !important}
  .rk-chip{font-size:clamp(11px, 1.2vw, 14px) !important;letter-spacing:1px !important}
  .rk-msg{font-size:clamp(16px, 1.8vw, 20px) !important}

  /* ═══════════ DRAWER (menú móvil) ═══════════ */
  .drawer a, .drawer span, .drawer ul, .drawer li{
    font-family:'Pixelify Sans', monospace !important;
    font-size:18px !important;
    letter-spacing:1px !important;
  }
</style>
</head>
<body>

<div class="fondo-gif" aria-hidden="true"></div>

<header>
  <div class="left">
    <a class="logo" href="#">
      <img class="coin" src="ho.png" alt="">
      <span class="logo-t">PIXELWORD</span>
    </a>
  </div>
  <div class="right">
    <button class="icon burger" id="burger" aria-label="Abrir menú" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-top">
    <button class="icon" id="drawerClose" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <span>Menú</span>
  </div>
  <ul>
    <li><a href="registro.html">Iniciar Sesión</a></li>
    <li><a href="ranking.html">Salón de la Fama</a></li>
  </ul>
</aside>

<main class="hero">
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="scrim"></div>
  <p class="kicker">Comience su</p>
  <h1 class="title"><img src="titulo.gif" alt="PIXELWORD"></h1>
  <p class="sub">La forma más divertida y accesible para principiantes de aprender a programar. ⋆˚</p>
  <a class="btn lg" href="registro.html">Comience</a>
  <a class="rk-link" href="#ranking">Ver ranking ▼</a>
</main>

<section class="rk-sec" id="ranking">
  <h2 class="rk-t">TOP 10 <span>JUGADORES</span></h2>
  <p class="rk-s">Los que más XP han ganado</p>
  <ol class="rk-list" id="rkList"><li class="rk-msg">Cargando ranking…</li></ol>
</section>

<div id="espada-cursor" popover="manual"><img src="ARMA.png" alt=""></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="java/firebase-init.js"></script>
<script src="java/script.js"></script>

<script>
/* ═════════════ RANKING TOP 10 EN VIVO ═════════════ */
(function(){
  const lista = document.getElementById('rkList');
  if (!lista) return;
  const msg = t => { lista.replaceChildren(Object.assign(document.createElement('li'), {className:'rk-msg', textContent:t})); };

  if (typeof db === 'undefined' || !db) { msg('No se pudo conectar con Firebase. Revisa tu conexión.'); return; }

  const RANGOS = [
    { n:'BRONCE',   min:0,    c:'#cd7f32' },
    { n:'ORO',      min:300,  c:'#ffc24b' },
    { n:'PLATINO',  min:700,  c:'#8fe8d8' },
    { n:'DIAMANTE', min:1200, c:'#4fd8ff' }
  ];
  const rangoDe = xp => RANGOS.reduce((a,r) => xp >= r.min ? r : a, RANGOS[0]);
  const yo = (localStorage.getItem('usuarioActual') || '').toLowerCase();

  function fila(d, i){
    const r = rangoDe(d.xp || 0);
    const li = document.createElement('li');
    li.className = 'rk-row' + ((d.usuario||'').toLowerCase() === yo ? ' me' : '');
    li.style.animationDelay = (i * 60) + 'ms';
    const pos = document.createElement('div'); pos.className='rk-pos'; pos.textContent = i + 1;
    const av  = document.createElement('img'); av.className='rk-av'; av.alt='';
    av.src = d.avatar || 'boy.gif';
    av.onerror = () => { av.onerror = null; av.src = 'boy.gif'; };
    const nm  = document.createElement('div'); nm.className='rk-name'; nm.textContent = d.usuario || '???';
    const ch  = document.createElement('span'); ch.className='rk-chip'; ch.textContent = r.n; ch.style.background = r.c;
    const xp  = document.createElement('div'); xp.className='rk-xp'; xp.textContent = (d.xp||0) + ' XP';
    li.append(pos, av, nm, ch, xp);
    return li;
  }

  db.collection('ranking').orderBy('xp','desc').limit(10).onSnapshot(
    snap => {
      if (snap.empty) return msg('Aún no hay jugadores. ¡Sé el primero!');
      lista.replaceChildren(...snap.docs.map((doc, i) => fila(doc.data(), i)));
    },
    err => {
      console.error(err);
      msg('No se pudo leer el ranking. Revisa las reglas de Firestore.');
    }
  );
})();

/* ═════════════ CURSOR ESPADA ═════════════ */
(function(){
  const s = document.getElementById('espada-cursor');
  if (!s) { console.warn('⚠️ No se encontró #espada-cursor'); return; }
  const raise = () => { try{s.hidePopover()}catch(e){} try{s.showPopover()}catch(e){} };
  window.raiseSword = raise; raise();
  document.addEventListener('mousemove', e => {
    s.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    s.classList.add('on');
  });
  document.documentElement.addEventListener('mouseleave', () => s.classList.remove('on'));
})();
</script>
</body>
</html>
