<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salón de la Fama · Coding Adventure</title>
<link rel="icon" type="image/png" href="ho.png">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#050a24; --panel:#0b1236; --linea:#1b2a6b; --texto:#eaf1ff; --suave:#8fa0d6;
    --amarillo:#fdc815; --amarillo-s:#c9940a; --cian:#4fd8ff; --rosa:#ff4f9a; --verde:#7cffb2;
    --bronce:#cd7f32; --oro:#fdc815; --platino:#c9d6ff; --diamante:#4fd8ff;
  }
  :root[data-tema="claro"]{
    --noche:#eef3ff; --panel:#ffffff; --linea:#223a9a; --texto:#0a1240; --suave:#4a5a99;
  }
  *{box-sizing:border-box;margin:0}
  html{height:100%}
  body{
    min-height:100%; background:var(--noche); color:var(--texto);
    font-family:'Mulish',sans-serif; line-height:1.5; padding:0 0 60px;
    position:relative; overflow-x:hidden;
  }
  
  /* ═══════ FONDO ESTRELLADO ═══════ */
  body::before{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background-image:url('Estrella.jpg.jpeg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    z-index:-2;
  }
  body::after{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:
      radial-gradient(2px 2px at 12% 20%,#fff8 50%,transparent 51%),
      radial-gradient(2px 2px at 78% 12%,#fff6 50%,transparent 51%),
      radial-gradient(2px 2px at 40% 70%,#fff5 50%,transparent 51%),
      radial-gradient(2px 2px at 90% 60%,#fff7 50%,transparent 51%),
      radial-gradient(1px 1px at 25% 45%,#fff6 50%,transparent 51%),
      radial-gradient(1px 1px at 65% 85%,#fff5 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 5% 90%,#fff7 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 95% 35%,#fff6 50%,transparent 51%);
    z-index:-1;
    animation:twinkle 8s ease-in-out infinite;
  }
  :root[data-tema="claro"] body::after{
    background:
      radial-gradient(2px 2px at 12% 20%,#050a2433 50%,transparent 51%),
      radial-gradient(2px 2px at 78% 12%,#050a2422 50%,transparent 51%),
      radial-gradient(2px 2px at 40% 70%,#050a2418 50%,transparent 51%);
  }
  @keyframes twinkle{
    0%,100%{opacity:1}
    50%{opacity:.7}
  }
  
  :focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 0; position:relative; z-index:1}

  .wrap header{text-align:center;margin:10px 0 26px}
  h1{
    font-family:'Pixelify Sans',monospace;font-size:clamp(2rem,6vw,3.4rem);color:var(--amarillo);
    text-shadow:4px 4px 0 var(--amarillo-s),8px 8px 0 #000;letter-spacing:1px;
  }
  .en-vivo{margin-top:16px;color:var(--suave);font-size:.9rem}
  .punto{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rosa);margin-right:8px;animation:lat 1.5s infinite}
  @keyframes lat{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.punto{animation:none}}

  /* Pestañas por rango */
  .tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px}
  .tab{
    font-family:'Pixelify Sans',monospace;font-size:1.05rem;color:var(--texto);background:var(--panel);
    border:3px solid var(--linea);padding:8px 16px;box-shadow:4px 4px 0 #000;transition:transform .1s;
  }
  .tab:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
  .tab[aria-selected="true"]{background:var(--c,var(--amarillo));color:#050a24;border-color:#000}
  .tab small{opacity:.75;font-family:'Mulish',sans-serif;font-size:.75rem;margin-left:4px}

  /* Podio */
  .podio{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:22px}
  .puesto{
    background:var(--panel);border:4px solid var(--c);box-shadow:6px 6px 0 #000;text-align:center;
    padding:16px 8px 14px;position:relative;
  }
  .puesto.p1{padding-top:28px;padding-bottom:22px}
  .puesto .medalla{font-size:2rem}
  .puesto img{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--c);background:#000;margin:8px 0}
  .puesto.p1 img{width:80px;height:80px}
  .puesto .nombre{font-family:'Pixelify Sans',monospace;font-size:1.15rem;overflow-wrap:anywhere}
  .puesto .xp{color:var(--c);font-weight:700}
  .puesto.vacio{opacity:.35;border-style:dashed}
  .puesto.yo,.fila.yo{outline:3px dashed var(--verde);outline-offset:3px}

  /* Lista 4-10 */
  .lista{background:var(--panel);border:4px solid var(--linea);box-shadow:8px 8px 0 #000}
  .fila{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:2px solid var(--linea)}
  .fila:last-child{border-bottom:0}
  .fila .pos{font-family:'Pixelify Sans',monospace;color:var(--suave);font-size:1.2rem}
  .fila .quien{display:flex;align-items:center;gap:12px;min-width:0}
  .fila img{width:34px;height:34px;image-rendering:pixelated;border:2px solid var(--linea);background:#000;flex:none}
  .fila .nombre{overflow-wrap:anywhere}
  .fila .xp{font-family:'Pixelify Sans',monospace;color:var(--amarillo)}
  .rango-tag{font-size:.78rem;padding:1px 8px;border:2px solid var(--c);color:var(--c);margin-left:8px;white-space:nowrap}
  .vacio-msg{padding:26px;text-align:center;color:var(--suave)}

  .tu-pos{margin-top:18px;text-align:center;font-family:'Pixelify Sans',monospace;color:var(--verde);font-size:1.1rem;min-height:1.6em}

  @media (max-width:560px){
    .wrap{padding:18px 10px 0}
    .podio{grid-template-columns:1fr}
    .puesto.p1{order:-1}
    .fila{grid-template-columns:36px 1fr auto;padding:10px}
  }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Salón de la Fama</h1>
    <p class="en-vivo"><span class="punto"></span>Los puntajes se actualizan solos</p>
  </header>

  <div class="tabs" role="tablist" id="tabs" aria-label="Filtrar por rango"></div>

  <div class="podio" id="podio"></div>
  <div class="lista" id="lista"></div>
  <p class="tu-pos" id="tuPos"></p>
</div>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="java/firebase-init.js"></script>
<script>
  // Tema claro/oscuro compartido
  try{ const t = localStorage.getItem('tema'); if (t === 'claro' || t === 'light') document.documentElement.dataset.tema = 'claro'; }catch(e){}

  const RANGOS = [
    {id:'diamante', nombre:'Diamante', min:1200, emoji:'💎', color:'#4fd8ff'},
    {id:'platino',  nombre:'Platino',  min:700,  emoji:'🔷', color:'#c9d6ff'},
    {id:'oro',      nombre:'Oro',      min:300,  emoji:'🥇', color:'#fdc815'},
    {id:'bronce',   nombre:'Bronce',   min:0,    emoji:'🥉', color:'#cd7f32'}
  ];
  const rangoDe = xp => RANGOS.find(r => xp >= r.min) || RANGOS[RANGOS.length - 1];
  const MEDALLAS = ['🥇','','🥉'];
  const COLORES_PODIO = ['#fdc815','#c9d6ff','#cd7f32'];

  let TODOS = [];
  let filtro = 'todos';
  let yo = '';
  try{ yo = (localStorage.getItem('usuarioActual')||'').toLowerCase(); }catch(e){}

  function el(tag, props, ...hijos){
    const e = document.createElement(tag);
    Object.assign(e, props||{});
    hijos.forEach(h => e.append(h));
    return e;
  }
  function avatar(j){
    const img = el('img', {src: j.avatar || 'boy.gif', alt: ''});
    img.onerror = () => { img.onerror = null; img.src = 'boy.gif'; };
    return img;
  }

  function pintarTabs(){
    const cont = document.getElementById('tabs');
    cont.innerHTML = '';
    const opciones = [{id:'todos', nombre:'Todos', emoji:'⭐', color:'#fdc815'}, ...RANGOS.slice().reverse()];
    opciones.forEach(o => {
      const n = o.id==='todos' ? TODOS.length : TODOS.filter(j => rangoDe(j.xp).id===o.id).length;
      const b = el('button', {className:'tab', role:'tab'}, `${o.emoji} ${o.nombre}`, el('small', {}, `(${n})`));
      b.setAttribute('aria-selected', o.id===filtro);
      b.style.setProperty('--c', o.color);
      b.onclick = () => { filtro = o.id; render(); };
      cont.append(b);
    });
  }

  function render(){
    pintarTabs();
    const lista = filtro==='todos' ? TODOS : TODOS.filter(j => rangoDe(j.xp).id===filtro);
    const top = lista.slice(0,10);

    // Podio (orden visual: 2º, 1º, 3º)
    const podio = document.getElementById('podio');
    podio.innerHTML = '';
    [1,0,2].forEach(i => {
      const j = top[i];
      const caja = el('div', {className:'puesto p'+(i+1)+(j?'':' vacio')});
      caja.style.setProperty('--c', COLORES_PODIO[i]);
      if(j){
        if(j.id===yo) caja.classList.add('yo');
        caja.append(
          el('div',{className:'medalla'},MEDALLAS[i]),
          avatar(j),
          el('div',{className:'nombre'}, j.usuario),
          el('div',{className:'xp'}, j.xp+' XP')
        );
      } else {
        caja.append(el('div',{className:'medalla'},MEDALLAS[i]), el('div',{className:'nombre'},'Libre'));
      }
      podio.append(caja);
    });

    // Puestos 4 al 10
    const cont = document.getElementById('lista');
    cont.innerHTML = '';
    if(top.length === 0){
      cont.style.display = '';
      cont.append(el('div',{className:'vacio-msg'}, filtro==='todos'
        ? 'Aún no hay puntajes. Resuelve un ejercicio y sé el primero.'
        : 'Nadie ha llegado a este rango todavía. Puedes ser el primero.'));
    } else if(top.length <= 3){
      cont.style.display = 'none';
    } else {
      cont.style.display = '';
      top.slice(3).forEach((j,k) => {
        const r = rangoDe(j.xp);
        const tag = el('span',{className:'rango-tag'}, r.emoji+' '+r.nombre);
        tag.style.setProperty('--c', r.color);
        const fila = el('div',{className:'fila'+(j.id===yo?' yo':'')},
          el('span',{className:'pos'}, '#'+(k+4)),
          el('span',{className:'quien'}, avatar(j), el('span',{className:'nombre'}, j.usuario, tag)),
          el('span',{className:'xp'}, j.xp+' XP'));
        cont.append(fila);
      });
    }

    // Posición del jugador actual
    const idx = TODOS.findIndex(j => j.id===yo);
    document.getElementById('tuPos').textContent =
      idx>=0 ? `Tu posición: #${idx+1} con ${TODOS[idx].xp} XP (${rangoDe(TODOS[idx].xp).nombre})` : '';
  }

  // Lectura en vivo del ranking
  if (typeof db === 'undefined' || !db) {
    document.getElementById('lista').append(el('div',{className:'vacio-msg'},
      'No se pudo conectar con Firebase. Revisa tu conexión y vuelve a intentar.'));
  } else {
    db.collection('ranking').orderBy('xp','desc').limit(200).onSnapshot(snap => {
      TODOS = snap.docs.map(d => {
        const x = d.data();
        return {
          id: d.id,
          usuario: x.usuario || d.id,
          xp: Number(x.xp) || 0,
          avatar: x.avatar
        };
      });
      render();
    }, err => {
      console.error(err);
      document.getElementById('lista').innerHTML = '';
      document.getElementById('lista').append(el('div',{className:'vacio-msg'},
        'No se pudo cargar el ranking. Revisa tu conexión y las reglas de Firestore.'));
    });
  }
  render();
</script>
</body>
</html>
