<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Coding Adventure</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* este es el coolor del fondo */
    body, .auth-container {
  background-color: #0b0f19 !important;
  min-height: 00vh;
  margin: 0;
}
/* este es e codigo de la animacion */
    @keyframes fadeIn {
      0% { 
        opacity: 0; 
        transform: scale(0.96); 
      }
      100% { 
        opacity: 1; 
        transform: scale(1); 
      }
    }

    body {
      opacity: 0;
      animation: fadeIn 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      color: #fff;
      font-family: 'Pixelify Sans', monospace;
    }
    .auth-card {
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid #0a0a09;
      padding: 30px;
      border-radius: 12px;
     
      width: 90%;
      max-width: 380px;
      text-align: center;
    }
    .auth-card h2 {
      margin-bottom: 20px;
      color: #ffe875;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #fff;
      font-family: inherit;
      box-sizing: border-box;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #ffe875;
      color: #000;
      border: none;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #f7a325;
    }
    .msg { min-height: 20px; margin-top: 14px; font-size: 14px; }
    .msg.ok { color: #7dffa0; }
    .msg.err { color: #ff8a8a; }
    .btn-submit:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Crear Cuenta</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="username">Usuario:</label>
          <input type="text" id="username" required autocomplete="username" placeholder="Tu nombre de usuario">
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" required autocomplete="new-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Registrarse</button>
      </form>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
    </div>
  </div>
  <script src="registro.js"></script>
</body>
</html>
