<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta - Coding Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/juegos.css">
<link rel="icon" href="ho.png">
<style>
@keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.5); } }
@keyframes shootingStar { 0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; } 100% { transform: translateX(-800px) translateY(800px) rotate(-45deg); opacity: 0; } }
@keyframes pixelSpin { 0% { content: "⠋"; } 14% { content: "⠙"; } 28% { content: "⠹"; } 42% { content: "⠸"; } 57% { content: "⠼"; } 71% { content: "⠴"; } 85% { content: "⠦"; } 100% { content: "⠧"; } }

* { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
body {
  min-height: 100vh; background-color: #0b0f19; background-image: url("Estrella.jpg.jpeg");
  background-size: cover; background-position: top center; background-repeat: no-repeat;
  font-family: 'Pixelify Sans', monospace; display: flex; align-items: center; justify-content: center;
  padding: 20px; position: relative; overflow: hidden;
}

.stars-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.twinkle-star { position: absolute; background: #ffffff; border-radius: 50%; box-shadow: 0 0 6px #38bdf8; animation: twinkle var(--duration) infinite ease-in-out; }
.meteor { position: absolute; width: 180px; height: 3px; background: linear-gradient(90deg, #ffffff, #38bdf8, transparent); transform: rotate(-45deg); pointer-events: none; opacity: 0; z-index: 1; box-shadow: 0 0 8px #38bdf8; animation: shootingStar 1.2s linear forwards; }

.auth-container { width: 100%; max-width: 400px; animation: fadeIn 0.6s ease-out forwards; position: relative; z-index: 2; }
.brand-header { text-align: center; margin-bottom: 20px; }
.brand-logo { font-size: 2.2rem; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 12px; }
.code-icon { color: #38bdf8; font-weight: bold; background: #111827; padding: 2px 8px; border: 2px solid #28354d; border-radius: 4px; font-size: 1.6rem; }
.brand-subtitle { color: #8c9ba5; font-size: 0.95rem; margin-top: 6px; }

.auth-card { background: #0d121f; border: 4px solid #1e293b; box-shadow: 6px 6px 0px #000000; padding: 28px; }
.auth-card h2 { font-size: 1.8rem; color: #ffe875; text-align: center; margin-bottom: 22px; letter-spacing: 1px; }

.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 8px; font-size: 0.95rem; color: #8c9ba5; }
.input-wrapper { position: relative; display: flex; align-items: center; }
.input-icon { position: absolute; left: 12px; font-size: 1.1rem; color: #64748b; }
.form-group input {
  width: 100%; padding: 12px 12px 12px 40px; border: 3px solid #1e293b;
  background: #070a12; color: #ffffff; font-family: 'Pixelify Sans', monospace;
  font-size: 1rem; outline: none; border-radius: 0;
}
.form-group input:focus { border-color: #38bdf8; background: #0b0f19; }
.hint { display: block; margin-top: 6px; font-size: 0.8rem; color: #64748b; }

.btn-submit {
  width: 100%; padding: 12px; background: #f7a325; color: #0b0f19;
  border: 3px solid #000000; font-weight: 700; font-family: 'Pixelify Sans', monospace;
  font-size: 1.3rem; cursor: pointer; margin-top: 10px;
  box-shadow: 4px 4px 0px #000000; transition: all 0.1s ease;
}
.btn-submit:hover { background: #ffe875; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000000; }
.btn-submit:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000000; }
.btn-submit:disabled { opacity: .6; pointer-events: none; }

.msg { margin-top: 15px; font-size: 0.9rem; text-align: center; min-height: 20px; }
.msg.ok { color: #7dffa0; }
.msg.err { color: #ff8a8a; }

.loading-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.loading-overlay.active { opacity: 1; pointer-events: all; }
.loading-box {
  background: #0d121f; border: 4px solid #1e293b; box-shadow: 6px 6px 0px #000000;
  padding: 30px 40px; text-align: center; max-width: 320px; width: 90%;
}
.loading-spinner { font-size: 2.5rem; color: #38bdf8; margin-bottom: 15px; display: inline-block; }
.loading-spinner::after { content: "⠋"; animation: pixelSpin 0.8s steps(8) infinite; }
.loading-box h3 { color: #ffe875; font-size: 1.4rem; margin-bottom: 8px; }
.loading-box p { color: #8c9ba5; font-size: 0.95rem; }

</style>
<style id="ajustes">
/* ═══════════ AJUSTES GLOBALES: puntero normal + responsive ═══════════ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,body *{cursor:auto!important}
body a,body button,body [onclick],body [role="button"],body label[for],body select,body summary,
body input[type="button"],body input[type="submit"],body input[type="checkbox"],body input[type="radio"],
body [class*="btn"],body [class*="boton"],body [class*="card"],body [class*="tab"]{cursor:pointer!important}
body input[type="text"],body input[type="password"],body input[type="tel"],body input[type="email"],body input:not([type]),body textarea{cursor:text!important}
body button:disabled,body .btn:disabled{cursor:not-allowed!important}
#espada-cursor{display:none!important}
img,video,canvas,svg,iframe{max-width:100%}
body{overflow-wrap:break-word}
@media (hover:none){input,select,textarea{font-size:max(16px,1em)}}
/* Registro: centrado seguro, sin recortar el formulario en pantallas bajas */
body{height:auto;min-height:100dvh;overflow-x:hidden;overflow-y:auto;align-items:flex-start}
.auth-container{margin:auto}
@media (max-width:480px){
  body{padding:14px}
  .brand-logo{font-size:1.7rem}
  .code-icon{font-size:1.2rem}
  .auth-card{padding:20px 16px}
  .auth-card h2{font-size:1.5rem}
  .btn-submit{min-height:46px}
}
</style>
</head>
<body>

<div class="stars-overlay" id="starsOverlay"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <h3>Registrando...</h3>
    <p>Construyendo tu mundo y perfil...</p>
  </div>
</div>

<div class="auth-container">
  <div class="brand-header">
    <div class="brand-logo">
      <span class="code-icon">&lt;/&gt;</span> Coding Adventure
    </div>
    <p class="brand-subtitle">Crea tu cuenta para continuar</p>
  </div>

  <div class="auth-card">
    <h2>Crear Cuenta</h2>
    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="username">Usuario:</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="username" required placeholder="Tu usuario" autocomplete="off" maxlength="20">
        </div>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="off">
        </div>
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="telefono" required placeholder="7000 0000" inputmode="numeric" maxlength="9" autocomplete="off">
        </div>
        <span class="hint">8 dígitos, sin el +503</span>
      </div>
      <button type="submit" class="btn-submit" id="btnSubmit">Registrarse</button>
      <p id="msg" class="msg"></p>
    </form>
  </div>
</div>

<!-- Estrellas, meteoritos y formato del teléfono -->
<script>
const overlay = document.getElementById('starsOverlay');
for (let i = 0; i < 35; i++) {
  const star = document.createElement('div');
  star.classList.add('twinkle-star');
  const size = Math.random() * 3.5 + 2;
  star.style.width = `${size}px`;
  star.style.height = `${size}px`;
  star.style.top = `${Math.random() * 100}%`;
  star.style.left = `${Math.random() * 100}%`;
  star.style.setProperty('--duration', `${Math.random() * 2 + 1}s`);
  star.style.animationDelay = `${Math.random() * 3}s`;
  overlay.appendChild(star);
}

function crearMeteorito() {
  const meteor = document.createElement('div');
  meteor.classList.add('meteor');
  meteor.style.left = `${Math.random() * window.innerWidth + 200}px`;
  meteor.style.top = `${Math.random() * (window.innerHeight / 2)}px`;
  document.body.appendChild(meteor);
  setTimeout(() => meteor.remove(), 1200);
  setTimeout(crearMeteorito, Math.random() * 1500 + 1000);
}
setTimeout(crearMeteorito, 1000);

// Teléfono: solo números, con formato 0000 0000 mientras escribe
const tel = document.getElementById('telefono');
tel.addEventListener('input', () => {
  const d = tel.value.replace(/\D/g, '').slice(0, 8);
  tel.value = d.length > 4 ? d.slice(0, 4) + ' ' + d.slice(4) : d;
});
</script>

<!-- FIREBASE PRIMERO, luego init, luego registro. SIN script.js NI juegos.js -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="java/firebase-init.js"></script>
<script src="java/progreso-cloud.js"></script>
<script src="java/registro.js"></script>

</body>
</html>
