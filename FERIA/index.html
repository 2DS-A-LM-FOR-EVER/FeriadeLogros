<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codédex – Coding Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Mulish:wght@600;700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#050a24">
  <script>try{if(localStorage.getItem("tema")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="left">
    <a class="logo" href="#"><span class="coin">0</span><span class="logo-t">Codédex</span></a>
    <nav>
      <a href="#">Aprender <svg class="chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></a>
      <a href="#">Práctica <svg class="chev" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></a>
    </nav>
  </div>
  <div class="right">
    <button class="icon" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="icon hide-m" aria-label="Cambiar tema" data-theme-toggle><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
    <button class="icon burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<!-- Menú lateral para celular -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-top">
    <button class="icon" id="drawerClose" aria-label="Cerrar menú"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <span>Menú</span>
  </div>
  <ul>
    <li><a href="#"><svg viewBox="0 0 24 24"><path d="M3 5h7a2 2 0 012 2v12a2 2 0 00-2-2H3z"/><path d="M21 5h-7a2 2 0 00-2 2v12a2 2 0 012-2h7z"/></svg><span>Aprender</span><svg class="go" viewBox="0 0 20 20"><path d="M7 4l6 6-6 6"/></svg></a></li>
    <li><a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Práctica</span><svg class="go" viewBox="0 0 20 20"><path d="M7 4l6 6-6 6"/></svg></a></li>
    <li><button type="button" data-theme-toggle><svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><span>Cambiar tema</span></button></li>
    <li><a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6z"/></svg><span>Iniciar sesión</span></a></li>
  </ul>
</aside>

<main class="hero">
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="scrim"></div>
  <p class="kicker">Comience su</p>
  <h1 class="title"><img src="LandingPage_Text.gif" alt="Coding Adventure"></h1>
  <p class="sub">La forma más divertida y accesible para principiantes de aprender a programar. ⋆˚✧</p>
  <a class="btn lg" href="#">Comience</a>
</main>



  <script src="script.js"></script>
</body>
</html>
